# MTP speculative decode (MAD-388/389/392). Measured 2026-07-19 at par1, full
# production config: nospec 16.50 -> n_max4 37.00 tok/s. n_max 4 was the best
# point in the sweep. The MTP draft context is untiered/unpaged by design and
# inherits the target ctx, so turbo4 keeps its KV small.
spec-type = draft-mtp
spec-draft-n-max = 4
spec-cache-type-k = turbo4
spec-cache-type-v = turbo4
cache-ram = 500
ctx-checkpoints = 4
metrics = true
timeout = 3600

