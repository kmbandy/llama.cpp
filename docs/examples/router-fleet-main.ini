# mad-lab-main — ONE router for the machine. Replaces the standalone units.
#
#   llama-server --models-preset <this file> --host 0.0.0.0 --port 8090
#
# EVERY model below is a faithful transcription of its systemd unit's ExecStart. Do not
# "simplify" a model's flags: the kv-tier split in particular is per-model and load-bearing
# (the middle number is the % of KV that lives in HOST RAM -- on a 15 GB box that is the
# scarcest resource, and getting it wrong costs GBs).
#
# GPU slots. NOTE the inversion: ROCm/HIP device 0 is the R9700, device 1 is the 6900 XT --
# the OPPOSITE of rocm-smi's numbering. Verified 2026-07-12:
#   rocm-smi GPU[1] = R9700     (0x7551) = /sys/class/drm/card1 = ROCm0 = 32624 MB
#   rocm-smi GPU[0] = RX 6900XT (0x73bf) = /sys/class/drm/card0 = ROCm1 = 16368 MB
#
# Aliases are UNIQUE per model -- the router uses the alias as the addressable name and
# refuses to start on a collision. (The old units had ornith-35b and qwen36-27b BOTH aliased
# "qwen36"; that was survivable only because they shared a port and one was always down.)
# The engine groups interchangeable servers by `tokenizer_family` in its own config, not
# by alias.
[*global*]
gpus = ROCm0:32624:/sys/class/drm/card1/device/mem_info_vram_used,ROCm1:16368:/sys/class/drm/card0/device/mem_info_vram_used
# NOTE: models-max / models-autoload / models-idle-timeout are ROUTER-level params and
# belong on the router's own command line, NOT here -- keys in [*global*] cascade into the
# CHILD model presets. See the systemd unit.
#
# Per-endpoint idle unload: set `idle-timeout = SECONDS` on a [section] to OVERRIDE the
# router-wide --models-idle-timeout for that model only (agents map to endpoints).
#   omit  -> inherit global (currently 30s on mad-lab-main)
#   0     -> never idle-unload this model (still exclusive-evictable / manual unload)
#   600   -> 10 minutes, good for interactive chat
# Autonomous workflows should leave this unset so the global 30s keeps cards free.
jinja = true
no-mmap = true
no-warmup = true
flash-attn = on
n-gpu-layers = 999

# ---------------------------------------------------------------------------
# Murmur scouts (engine tokenizer_family: lfm2.5-8b-a1b)
# ---------------------------------------------------------------------------

[lfm25-8b-6900xt-murmur]
model = /home/kmbandy/models/LFM2.5-8B-A1B-Q8_0.gguf
alias = lfm25-8b-6900xt-murmur
gpu = ROCm1
vram-mb = 15000
ctx-size = 1572864
parallel = 24
cache-type-k = turbo4
cache-type-v = turbo4
kv-tiered = 75,25,0
kv-tier-paged-blocks = true
kv-tier-ssd-path = /home/kmbandy/llama/kv-cold/lfm25-8b
kv-tier-semantic-index = /home/kmbandy/models/granite-embedding-small-english-r2.Q8_0.gguf
# MAD-348: model + threshold + prefixes are ONE unit. Granite: 0.84, NO prefixes.
# (LFM2.5 would need 0.35 + "query: "/"document: "; BGE 0.63 + a query instruction.)
# Measured 2026-07-14: granite AUC 0.975 on same-topic passages vs LFM2.5's 0.895,
# 7x smaller, and prefill at 18k ctx 468 -> 1056 tok/s (92% of semantic-OFF).
kv-tier-semantic-threshold = 0.84
kv-tier-semantic-parallel = 3
cache-ram = 1000
ctx-checkpoints = 4
reasoning-budget = -1

# Mirrors the 6900xt scout exactly, on the faster card. NOT scaled up (bigger ctx x a 25%
# host tier buys VRAM headroom with HOST RAM we do not have) -- tune deliberately, with the
# RAM cost measured, not by assuming the 32 GB card wants a bigger context.
[lfm25-8b-r9700-murmur]
model = /home/kmbandy/models/LFM2.5-8B-A1B-Q8_0.gguf
alias = lfm25-8b-r9700-murmur
gpu = ROCm0
vram-mb = 15000
ctx-size = 1572864
parallel = 24
cache-type-k = turbo4
cache-type-v = turbo4
kv-tiered = 75,25,0
kv-tier-paged-blocks = true
kv-tier-ssd-path = /home/kmbandy/llama/kv-cold/lfm25-8b-r9700
kv-tier-semantic-index = /home/kmbandy/models/granite-embedding-small-english-r2.Q8_0.gguf

# MAD-348: model + threshold + prefixes are ONE unit. Granite: 0.84, NO prefixes.
# (LFM2.5 would need 0.35 + "query: "/"document: "; BGE 0.63 + a query instruction.)
# Measured 2026-07-14: granite AUC 0.975 on same-topic passages vs LFM2.5's 0.895,
# 7x smaller, and prefill at 18k ctx 468 -> 1056 tok/s (92% of semantic-OFF).
kv-tier-semantic-threshold = 0.84
# The fingerprint sweep runs the embedder SYNCHRONOUSLY on the server's single
# inference thread. At parallel=1 all 24 slots serialize behind one embed lock,
# stalling the batch that carries every other slot's decode token. The pool shares
# one copy of the weights, so this costs ~nothing.
kv-tier-semantic-parallel = 3
cache-ram = 1000
ctx-checkpoints = 4
reasoning-budget = -1

