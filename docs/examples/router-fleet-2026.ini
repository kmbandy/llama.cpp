# mad-lab-2026 — ONE router for the machine. Replaces the standalone units.
#
#   llama-server --models-preset docs/examples/router-fleet-2026.ini --host 127.0.0.1 --port 8090
#
# GPU slots: CUDA0 = GTX 1070 (8 GB, probed via NVML), Vulkan0 = RX 480 (8 GB,
# probed via sysfs). Both cards are small, so nothing here co-resides -- the
# router's ledger will evict as needed.
#
# NOT HERE: the Nemotron embedder. It stays a standalone service on :8082.
# mneme/store.py hardcodes http://127.0.0.1:8082/v1/embeddings and the whole fleet
# writes memory through it on every message -- and it is n-gpu-layers 0 (CPU), so
# the router (a GPU VRAM ledger) would manage nothing while adding a way to break
# memory for every agent. Leave it alone.
#
# Aliases are UNIQUE per model (the router refuses to start on a collision).
# The engine groups interchangeable servers by `tokenizer_family` in its own
# endpoint config, NOT by alias.
[*global*]
gpus = CUDA0:8192:nvml:0,Vulkan0:8192:/sys/class/drm/card1/device/mem_info_vram_used
# NOTE: models-max / models-autoload / models-idle-timeout are ROUTER-level params and
# belong on the router command line, NOT here -- keys in [*global*] cascade into the CHILD
# model presets. See the systemd unit.
jinja = true
no-warmup = true
flash-attn = on
n-gpu-layers = 999

# --------------------------------------------------------------------------
# Murmur scouts (tokenizer_family: lfm2.5-8b-a1b). Same model+quant on both;
# only the card and the KV tier split differ.
# --------------------------------------------------------------------------

[lfm25-8b-1070-murmur]
model = /home/kmbandy/models/LFM2.5-8B-A1B-UD-Q6_K.gguf
alias = lfm25-8b-1070-murmur
gpu = CUDA0
# 6.5 GB weights + turbo4 KV; measured 7990 MB of 8192 resident -- this card is
# FULL. Do not raise ctx or parallel without taking something else away.
vram-mb = 8000
ctx-size = 524288
parallel = 8
reasoning-budget = -1
cache-type-k = turbo4
cache-type-v = turbo4
cache-ram = 500
ctx-checkpoints = 4
kv-tiered = 50,50,0
kv-tier-paged-blocks = true
kv-tier-ssd-path = /home/kmbandy/llama/kv-cold/lfm25-8b-1070
kv-tier-semantic-index = /home/kmbandy/models/granite-embedding-small-english-r2.Q8_0.gguf
# MAD-348: model + threshold are ONE unit. Granite: 0.84, NO prefixes (pooling read from GGUF).
# 7x smaller than LFM2.5-350M; on this 4c/8t box the embedder thread lever does not exist and
# both GPUs are full, so a smaller model is the ONLY lever. Retrieval AUC 0.975 vs 0.895.
kv-tier-semantic-threshold = 0.84

[lfm25-8b-480-murmur]
model = /home/kmbandy/models/LFM2.5-8B-A1B-UD-Q6_K.gguf
alias = lfm25-8b-480-murmur
gpu = Vulkan0
vram-mb = 8000
ctx-size = 524288
parallel = 8
reasoning-budget = -1
cache-type-k = turbo4
cache-type-v = turbo4
cache-ram = 500
ctx-checkpoints = 4
kv-tiered = 60,40,0
kv-tier-paged-blocks = true
kv-tier-ssd-path = /home/kmbandy/llama/kv-cold/lfm25-8b-swarm-480
# NO kv-tier-semantic-index here, deliberately. The semantic-index embedder is NOT
# CPU-only despite mt-embed.cpp setting n_gpu_layers=0: it leaves mparams.devices
# unset, so llama_init_from_model still builds a CUDA backend and schedules ops on
# it. In THIS child the main model is on Vulkan0 (the 480), so that stray CUDA
# context lands on CUDA0 -- the 1070 -- which is already full at 7990/8192 MB with
# its own scout. Result: `CUDA error: out of memory` in ggml_cuda_op_mul during
# warmup_embed_, and the 480 child dies with status 1 before serving a token.
# Only bites when both cards are loaded at once, which is why concurrency exposed it.
# Dropping the index costs eviction QUALITY (falls back to recency), not correctness.
# Restore this line once mt-embed.cpp pins the embedder to a CPU-only device list.
# MAD-348 (2026-07-14): DONE via that fix -- granite (47M) + threshold 0.84.
# VERIFY AT RUNTIME: load BOTH 1070 and 480 scouts at once; confirm NO CUDA OOM on
# the 1070 during the 480 child warmup (the failure this restore depends on being fixed).
kv-tier-semantic-index = /home/kmbandy/models/granite-embedding-small-english-r2.Q8_0.gguf
kv-tier-semantic-threshold = 0.84

# --------------------------------------------------------------------------
# Mneme embedder. CPU-ONLY by design (n-gpu-layers 0) -- it used to open a stray
# CUDA context on the 1070 and squat ~200 MB of a card that is already full.
# Pinned: the whole fleet's memory writes depend on it, it must never be evicted.
# --------------------------------------------------------------------------
# Other 2026 models. Evictable; loaded on demand.
# --------------------------------------------------------------------------

[lfm25-8b-curation]
model = /home/kmbandy/models/LFM2.5-8B-A1B-UD-Q6_K.gguf
alias = lfm25-8b-curation
gpu = Vulkan0
vram-mb = 7000
ctx-size = 24576
parallel = 1
reasoning-budget = 0

[ornith-9b]
model = /home/kmbandy/models/ornith-9b-mtp-kl-Q4_K_M.gguf
alias = ornith-9b
gpu = CUDA0
vram-mb = 7600
ctx-size = 262144
parallel = 2
cache-type-k = turbo4
cache-type-v = turbo4
cache-ram = 500
ctx-checkpoints = 4
kv-tiered = 90,10,0
kv-tier-paged-blocks = true
kv-tier-ssd-path = /home/kmbandy/llama/kv-cold/ornith-9b
kv-tier-semantic-index = /home/kmbandy/models/granite-embedding-small-english-r2.Q8_0.gguf
# MAD-348: model + threshold are ONE unit. Granite: 0.84, NO prefixes (pooling read from GGUF).
# 7x smaller than LFM2.5-350M; on this 4c/8t box the embedder thread lever does not exist and
# both GPUs are full, so a smaller model is the ONLY lever. Retrieval AUC 0.975 vs 0.895.
kv-tier-semantic-threshold = 0.84

# General LFM2.5 for mad-lab-mid-eng / mad-lab-subagent-code-light. Their endpoint
# ("lfm25-8b") points at localhost:8096 today, but llama-server-lfm25-8b.service
# actually listens on 8097 -- so that endpoint has been pointing at nothing.
[lfm25-8b]
model = /home/kmbandy/models/LFM2.5-8B-A1B-UD-Q6_K.gguf
alias = lfm25-8b
gpu = Vulkan0
vram-mb = 7000
ctx-size = 65536
parallel = 2
cache-type-k = turbo4
cache-type-v = turbo4
cache-ram = 500
ctx-checkpoints = 4

# ---------------------------------------------------------------------------
# SYNTH-FLEET (MAD-160, added 2026-07-14, parallel-decode investigation).
# The murmur scouts above are tuned for DEEP context (65536/slot, half the KV in
# host RAM, semantic index). The synth job is the opposite shape: low context, no
# reasoning, many short independent records. On the 6900XT, dropping the KV stack
# and driving full slot occupancy took aggregate 100 -> 393 tok/s (3.9x), no code
# change. These are the same treatment for the small cards.
# Both cards are 8 GB with ~6.5 GB of weights resident, so slots are TIGHT --
# sized conservatively and VRAM-verified, not assumed.
# ---------------------------------------------------------------------------

[lfm25-8b-1070-synth]
model = /home/kmbandy/models/LFM2.5-8B-A1B-UD-Q6_K.gguf
alias = lfm25-8b-1070-synth
gpu = CUDA0
vram-mb = 8000
ctx-size = 65536
parallel = 16
cache-type-k = turbo4
cache-type-v = turbo4
reasoning-budget = 0

[lfm25-8b-480-synth]
model = /home/kmbandy/models/LFM2.5-8B-A1B-UD-Q6_K.gguf
alias = lfm25-8b-480-synth
gpu = Vulkan0
vram-mb = 8000
ctx-size = 65536
parallel = 16
cache-type-k = turbo4
cache-type-v = turbo4
reasoning-budget = 0

# The RX 480 did NOT behave like the big card: at parallel=16 the synth config
# (54 tok/s) LOST to the murmur preset at parallel=8 (76 tok/s). The 480 is the
# weakest card in the fleet; 16 concurrent streams appear to be past its compute
# limit. This isolates slot count from the KV-stack change -- synth flags, par 8.
[lfm25-8b-480-synth8]
model = /home/kmbandy/models/LFM2.5-8B-A1B-UD-Q6_K.gguf
alias = lfm25-8b-480-synth8
gpu = Vulkan0
vram-mb = 8000
ctx-size = 32768
parallel = 8
cache-type-k = turbo4
cache-type-v = turbo4
reasoning-budget = 0

