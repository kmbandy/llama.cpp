version = 1

[dsv41]
model = /models/dsv41-spine.gguf
machine = mad-lab-main
gpu = ROCm1
depends = dsv41-w-main,dsv41-w-2026
stop-timeout = 120
slot-autosave = /var/lib/router/dsv41.slot
startup-timeout = 600

[dsv41-w-main]
kind = external
machine = mad-lab-main
gpu = ROCm0
launch = /opt/bin/expert-worker --port 9001 --shard 0
vram-mb = 31300
ram-mb = 38000
park-file = /var/lib/router/dsv41-w-main.park
park-mode = opt-in

[dsv41-w-2026]
kind = external
machine = mad-lab-2026
gpu = ROCm1
launch = /opt/bin/expert-worker --port 9002 --shard 1
vram-mb = 14200
ram-mb = 21000
park-file = /var/lib/router/dsv41-w-2026.park
