version = 1

[local]
model = /models/local.gguf
kv-preserve = /var/lib/kv
kv-preserve-mb = 4096

[remote]
model = /models/remote.gguf
machine = mad-lab-2026
kv-preserve = /var/lib/kv

[spine]
model = /models/spine.gguf
machine = mad-lab-main
depends = spine-w1
kv-preserve = /var/lib/kv
kv-preserve-mb = 2048

[spine-w1]
kind = external
machine = mad-lab-main
launch = /opt/bin/expert-worker --port 9001
kv-preserve = /var/lib/kv

[explicit]
model = /models/explicit.gguf
kv-preserve = /var/lib/kv
stop-timeout = 15

[plain]
model = /models/plain.gguf

[badst]
model = /models/badst.gguf
kv-preserve = /var/lib/kv
stop-timeout = abc
